name: Deploy web dashboard to GitHub Pages

# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set AI server URL in index.html (blank keeps offline text)
        env:
          PROXY_URL: ${{ vars.TAHADHARI_PROXY_URL }}
        run: |
          # Escape sed specials in the value (\ & |) and drop anything that could break the attribute.
          safe=$(printf '%s' "$PROXY_URL" | tr -d '\r\n"<>' | sed -e 's/[\\&|]/\\&/g')
          sed -i "s|<meta name=\"tahadhari-proxy-url\" content=\"\">|<meta name=\"tahadhari-proxy-url\" content=\"${safe}\">|" composeApp/src/wasmJsMain/resources/index.html
          grep 'tahadhari-proxy-url' composeApp/src/wasmJsMain/resources/index.html

      - name: Build web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
