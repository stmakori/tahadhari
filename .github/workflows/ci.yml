name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image provides ANDROID_HOME; the Android Gradle plugin reads it, so no
      # local.properties is needed.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, assemble and package
        run: >
          ./gradlew
          :composeApp:allTests :shared:jvmTest :server:test
          :composeApp:assembleDebug :composeApp:wasmJsBrowserDistribution
          :composeApp:packageDistributionForCurrentOS
          --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tahadhari-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Linux installer (.deb)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tahadhari-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # The deployable AI server image (Dockerfile at the root) builds and answers /health.
  # A dummy key is enough: /health never calls the AI.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the AI server image
        run: docker build -t tahadhari-server .

      - name: Start it and check /health
        run: |
          docker run -d --name ai -p 8080:8080 -e ANTHROPIC_API_KEY=ci-dummy tahadhari-server
          for i in $(seq 1 60); do curl -fsS localhost:8080/health && exit 0; sleep 1; done
          docker logs ai
          exit 1

  # Smoke test of the phone app on an Android emulator (intro, county, Safety, Emergency, Back).
  # The network may be unavailable or flaky on CI: the test accepts a risk card or the error state.
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the x86_64 emulator (from the android-emulator-runner docs).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :composeApp:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            composeApp/build/reports/androidTests/
            composeApp/build/outputs/androidTest-results/
          if-no-files-found: ignore
