name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image provides ANDROID_HOME; the Android Gradle plugin reads it, so no
      # local.properties is needed.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, assemble and package
        run: >
          ./gradlew
          :composeApp:allTests :shared:jvmTest :server:test
          :composeApp:assembleDebug :composeApp:wasmJsBrowserDistribution
          :composeApp:packageDistributionForCurrentOS
          --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tahadhari-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Linux installer (.deb)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tahadhari-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
