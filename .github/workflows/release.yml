name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Optional signing. Secrets: TAHADHARI_KEYSTORE_BASE64 (base64 of the .jks),
      # TAHADHARI_KEYSTORE_PASSWORD, TAHADHARI_KEY_ALIAS, TAHADHARI_KEY_PASSWORD.
      # Without them the APK is built with the debug key (the Gradle build warns).
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAHADHARI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "TAHADHARI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: the release APK will be debug-signed."
          fi

      - name: Build release APK
        env:
          TAHADHARI_KEYSTORE_PASSWORD: ${{ secrets.TAHADHARI_KEYSTORE_PASSWORD }}
          TAHADHARI_KEY_ALIAS: ${{ secrets.TAHADHARI_KEY_ALIAS }}
          TAHADHARI_KEY_PASSWORD: ${{ secrets.TAHADHARI_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --stacktrace

      - name: Name the APK
        run: cp composeApp/build/outputs/apk/release/composeApp-release.apk "Tahadhari-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Tahadhari-*.apk
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: msi
            glob: composeApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            artifact: dmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            artifact: deb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Package desktop installer
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -lR dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
